<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignite Club</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h1>IGNITE CLUB</h1>
        <ul>
            <li><a href="#about">About</a></li>
            <li><a href="#events">Events</a></li>
            <li><a href="#ai-chat">AI Assistant</a></li>
        </ul>
    </nav>

    <header>
        <h2>Igniting Innovation in Tech</h2>
        <p>Join our community of developers and creators.</p>
        <button onclick="alert('Coming Soon!')">Join the Club</button>
    </header>

    <script src="script.js"></script>
    <script>
    async function testAI() {
        const statusDiv = document.getElementById('ai-status');
        statusDiv.innerText = "Consulting the AI...";
        
        try {
            // We will replace 'localhost' with your Render/Railway URL later
            const response = await fetch('http://localhost:8000/ask?question=How do I join?');
            const data = await response.json();
            statusDiv.innerText = "AI Response: " + data.answer;
        } catch (error) {
            statusDiv.innerText = "Error: Backend not running yet.";
        }
    }
</script>

<button onclick="testAI()">Test AI Connection</button>
</body>
</html>
